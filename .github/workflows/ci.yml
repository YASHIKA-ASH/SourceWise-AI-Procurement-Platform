name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: https://sourcewise-35-175-11-218.nip.io
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Reject the retired Render API
        run: |
          if grep -RIn --exclude-dir=node_modules --exclude-dir=dist \
            'sourcewise-ai-procurement-platform-1\.onrender\.com' .; then
            echo 'The retired Render API is still referenced in the frontend.' >&2
            exit 1
          fi

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      DATABASE_URL: sqlite:///./sourcewise-ci.db
      JWT_SECRET_KEY: ci-only-random-secret-with-more-than-thirty-two-characters
      REDIS_URL: ""
      GEMINI_API_KEY: test-key
      CHROMA_PATH: /tmp/sourcewise-chroma
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Reject Python module file/folder conflicts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app')
          conflicts = [
              (file, file.with_suffix(''))
              for file in app.glob('*.py')
              if file.with_suffix('').is_dir()
          ]

          if conflicts:
              for file, folder in conflicts:
                  print(f'Conflict: {file} and {folder}')
              raise SystemExit(1)

          print('No Python module file/folder conflicts found.')
          PY

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest tests -q
